name: Continuous Integration
on:
    pull_request:
        branches: 
            - main

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Python Lint Code Scanning Action
              uses: advanced-security/python-lint-code-scanning-action@v1.1.3
              with:
                  linter: pylint